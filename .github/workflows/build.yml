name: Compila FZRSkimmer.exe

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # perseususb.dll è a 32 bit: serve Python a 32 bit (x86)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0 pillow

      - name: Controllo 32 bit
        run: python -c "import struct,sys; b=struct.calcsize('P')*8; print(sys.version, b, 'bit'); assert b==32"

      - name: Prova del motore (CW sintetico)
        run: python selftest.py

      - name: Crea l'eseguibile
        run: pyinstaller --onefile --console --name FZRSkimmer --icon logo.ico --add-data "index.html;." --add-data "logo.png;." splitwatch.py

      - name: Prova l'eseguibile
        run: dist\FZRSkimmer.exe --help

      - name: Prepara la cartella FZRSkimmer
        run: |
          mkdir FZRSkimmer
          copy dist\FZRSkimmer.exe FZRSkimmer\
          copy LEGGIMI.md FZRSkimmer\
          copy prepara_cartella.bat FZRSkimmer\
          copy logo.png FZRSkimmer\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: FZRSkimmer
          path: FZRSkimmer
