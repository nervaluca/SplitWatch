name: Compila FZRSkimmer.exe

on:
  push:
  workflow_dispatch:

# più commit di fila (file caricati uno alla volta): compila solo l'ultimo, gli altri si annullano
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # perseususb.dll è a 32 bit: serve Python a 32 bit (x86)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0 pillow==10.4.0

      - name: Logo e icona
        run: |
          python -c "import os;from PIL import Image,ImageDraw;src=next((f for f in ('logo.png','fzrskimmer.png') if os.path.exists(f)),None);assert src,'manca il logo';im=Image.open(src).convert('RGBA');w,h=im.size;s=min(w,h);im=im.crop(((w-s)//2,(h-s)//2,(w-s)//2+s,(h-s)//2+s));m=Image.new('L',im.size,0);ImageDraw.Draw(m).ellipse((int(s*.012),int(s*.012),int(s*.988),int(s*.988)),fill=255);im.putalpha(m);os.path.exists('logo.png') or im.resize((256,256)).save('logo.png');os.path.exists('logo.ico') or im.save('logo.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]);print('logo ok')"

      - name: Controllo 32 bit
        run: python -c "import struct,sys; b=struct.calcsize('P')*8; print(sys.version, b, 'bit'); assert b==32"

      - name: Prova del motore (CW sintetico)
        run: python selftest.py

      # tutti i file del programma ci sono e si caricano (un .py dimenticato fa fallire qui, con il nome)
      - name: Controllo dei moduli
        run: |
          python -c "import splitwatch, dsp, sources, banco, ponti, rig, calib, i18n, licenza, rbn, recorder, rtty; print('moduli OK', splitwatch.VERSION)"
          if ($LASTEXITCODE -ne 0) { if (Test-Path fzrskimmer_errore.txt) { Get-Content fzrskimmer_errore.txt }; Get-ChildItem *.py | Format-Table Name, Length, LastWriteTime -AutoSize | Out-String | Write-Host; exit 1 }
        shell: pwsh

      - name: Crea l'eseguibile
        run: pyinstaller --onefile --noconsole --disable-windowed-traceback --name FZRSkimmer --icon logo.ico --add-data "index.html;." --add-data "logo.png;." splitwatch.py

      - name: Prova l'eseguibile (avvio e uscita)
        run: |
          Start-Process -FilePath dist\FZRSkimmer.exe -ArgumentList '--no-browser','--sorgente','audio' -PassThru | Set-Variable p
          # l'exe "a file unico" al primo avvio si scompatta e Windows Defender lo controlla: può volerci un po'
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8073/ | Out-Null; $ok = $true; break } catch { }
            if ($p.HasExited) { Write-Host "il programma si è chiuso (codice $($p.ExitCode))"; break }
          }
          Write-Host "attesa: $i s · processo ancora acceso: $(-not $p.HasExited)"
          Get-Process FZRSkimmer -ErrorAction SilentlyContinue | Format-Table Id, CPU, WorkingSet -AutoSize | Out-String | Write-Host
          $found = $false
          foreach ($f in 'dist\fzrskimmer_errore.txt', 'fzrskimmer.log', 'dist\fzrskimmer.log', "$env:APPDATA\FZRSkimmer\fzrskimmer.log") { if (Test-Path $f) { $found = $true; Write-Host "--- $f"; Get-Content $f } }
          if (-not $found) { Write-Host 'nessun fzrskimmer.log: il programma non è arrivato a scrivere (exe ancora in avvio?)' }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($ok) { Write-Host 'interfaccia OK' } else { Write-Host 'interfaccia non raggiungibile'; exit 1 }
        shell: pwsh

      # chiavetta RTL-SDR: rtl_tcp.exe e le sue librerie dalla release ufficiale di RTL-SDR Blog (GPLv2).
      # Se qualcosa non va la compilazione continua: rtl_tcp si può sempre aggiungere a mano.
      - name: Chiavetta RTL-SDR (rtl_tcp)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R rtlsdrblog/rtl-sdr-blog --pattern '*.zip' -D rtlzip
          if (-not (Get-ChildItem rtlzip -Filter *.zip -ErrorAction SilentlyContinue)) { gh release download v1.3.6 -R rtlsdrblog/rtl-sdr-blog --pattern '*.zip' -D rtlzip }
          Get-ChildItem rtlzip -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath (Join-Path 'rtlx' $_.BaseName) -Force }
          $all = Get-ChildItem rtlx -Recurse -Filter rtl_tcp.exe
          $exe = ($all | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1)
          if (-not $exe) { $exe = $all | Select-Object -First 1 }
          if (-not $exe) { Write-Host 'rtl_tcp.exe non trovato nella release'; exit 1 }
          New-Item -ItemType Directory -Force dist\rtl | Out-Null
          Get-ChildItem $exe.DirectoryName | Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination dist\rtl\
          Set-Content dist\rtl\LEGGIMI_rtl.txt "rtl_tcp e librerie: progetto rtl-sdr / RTL-SDR Blog, licenza GPL v2.`r`nSorgenti: https://github.com/rtlsdrblog/rtl-sdr-blog`r`nLa chiavetta vuole il driver WinUSB (Zadig), come per SDR#."
          Get-ChildItem dist\rtl | ForEach-Object { Write-Host $_.Name }
        shell: pwsh

      - name: Prepara la cartella FZRSkimmer
        run: |
          mkdir FZRSkimmer
          copy dist\FZRSkimmer.exe FZRSkimmer\
          if exist dist\rtl xcopy /E /I /Y dist\rtl FZRSkimmer\rtl
          copy LEGGIMI.md FZRSkimmer\
          if exist README_EN.md copy README_EN.md FZRSkimmer\
          if exist prepara_cartella.bat copy prepara_cartella.bat FZRSkimmer\
          copy logo.png FZRSkimmer\
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: FZRSkimmer
          path: FZRSkimmer

      # installazione per Windows (Inno Setup): FZRSkimmer_Setup_<versione>.exe
      - name: Crea l'installazione
        run: |
          $v = python -c "import re;s=open('splitwatch.py',encoding='utf-8').read();print(re.search('^VERSION = .(.+?).$',s,re.M).group(1))"
          Write-Host "versione $v"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      - name: Prova l'installazione (silenziosa)
        run: |
          $setup = Get-ChildItem Output\FZRSkimmer_Setup_*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\FZR Skimmer\FZRSkimmer.exe'
          if (Test-Path $exe) { Write-Host "installato: $exe" } else { Write-Host 'exe non installato'; exit 1 }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: FZRSkimmer_Setup
          path: Output/*.exe
