<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FZR Skimmer</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
/* Layout: barra stato · comandi · waterfall dal vivo (sx) + testo decodificato (dx) · riga DX · impostazioni */
:root{
  --bg:#090d12; --panel:#0f161e; --line:#1c2732; --fg:#cfdae4; --dim:#6c7e8f;
  --accent:#5fd4d6; --hot:#ffb020; --dx:#58d98b; --bad:#ff6b6b;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px}
.app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(260px,1fr) auto auto;gap:10px;padding-inline:16px;padding-block:12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.brandbox{display:flex;align-items:center;gap:12px}
.brandbox img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 1px #3a2c12,0 4px 18px #0009;flex:none}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .name{font-weight:700;font-size:1.45rem;letter-spacing:.02em;line-height:1}
.brand .name b{color:#e9b949;font-weight:700}
.brand .motto{font-size:.74rem;color:#c9a24a;letter-spacing:.14em;text-transform:uppercase}
.brand .tag{font-size:.78rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0}
.stats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats dt{font-size:.72rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.stats dd{margin:0;font-family:var(--f-mono);font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .hot dd{color:var(--hot)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:.72rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
button{font:600 .92rem var(--f-ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer;letter-spacing:.02em}
button:hover{border-color:#2f4152;background:#131c26}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:#123038;border-color:var(--accent);color:#e8fbfb}
button.big{font-size:1rem;padding:7px 14px}
button.band{min-width:3.2em;font-family:var(--f-mono)}
button.band[aria-pressed="true"]{background:#2a2410;border-color:var(--hot);color:#ffe2a8}
button.band.pred{opacity:.75}
button.audio{background:#123020;border-color:#2a6a45;color:#dff7e8}
button.audio[aria-pressed="true"]{background:#1d5a37;border-color:var(--dx)}
.chip{font:500 .82rem var(--f-mono);padding:4px 8px;border-color:#3a2c12;color:var(--hot);background:#17120a}
.chip.old{opacity:.55}
input[type=number]{width:7.2em;font:500 .9rem var(--f-mono);background:#0b1118;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
input.short{width:4.6em}
select{font:500 .9rem var(--f-mono);background:#0b1118;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.scope{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,34%);min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#05080c}
.cell{position:relative;min-width:0;min-height:0}
.cell+.cell{border-left:1px solid var(--line);background:#0a1016}
canvas{display:block;width:100%;height:100%;touch-action:none}
#wf{cursor:ns-resize}
.off{position:absolute;left:10px;font:600 .9rem var(--f-mono);color:#1a1205;background:var(--hot);border:0;padding:5px 10px;box-shadow:0 2px 10px #0008}
.off:hover{background:#ffc34d;color:#1a1205}
.off.top{top:8px}.off.bot{bottom:8px}
.menu{position:absolute;z-index:5;background:#121b25;border:1px solid #2f4152;border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 24px #000a}
.menu button{text-align:left;border:0;background:transparent}
.menu button:hover{background:#1b2835}
.dxline{display:flex;gap:10px;align-items:baseline;font-family:var(--f-mono);font-size:1.02rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0;overflow:hidden;white-space:nowrap}
.dxline .who{color:var(--dx);font-weight:600;flex:none}
#dxText{overflow:hidden;direction:rtl;text-align:left;min-width:0;flex:1;color:#9fb1c0}
#dxText>span{direction:ltr;unicode-bidi:isolate}
.k-hot{background:var(--hot);color:#1a1205;border-radius:3px;padding:0 3px}
.k-call{color:#f1f6fa}
.set{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.9rem}
.set label{display:flex;gap:6px;align-items:center;color:var(--dim)}
#status{font-family:var(--f-mono);font-size:.82rem;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 240px}
#status.err{color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--dx)}
@media (max-width:560px){.stats{gap:6px 16px}.stats dd{font-size:.84rem}.scope{grid-template-columns:minmax(0,1fr) minmax(130px,42%)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandbox"><img src="/logo.png" alt="FZR Skimmer">
      <div class="brand"><span class="name"><b>FZR</b> Skimmer <span style="color:var(--dim);font-weight:500;font-size:.8em">1.1</span></span><span class="motto">dai punti alle parole</span><span class="tag" id="tag">pile-up in split</span></div></div>
    <dl class="stats">
      <div><dt>RX fisso sul DX</dt><dd id="sDx">—</dd></div>
      <div><dt>Vista</dt><dd id="sView">—</dd></div>
      <div class="hot"><dt>Ultimo ascolto rilevato</dt><dd id="sLast">—</dd></div>
    </dl>
  </header>

  <div class="ctrl" id="bandRow">
    <div class="grp" id="bands"><span class="lbl">Banda</span></div>
    <button id="bSave" title="Memorizza centro e DX attuali per questa banda">Salva memoria</button>
  </div>

  <div class="ctrl">
    <div class="grp">
      <button class="audio" id="bAudio" aria-pressed="false">🔈 Audio DX</button>
      <button class="big" id="bDn">▼ 5 kHz</button>
      <button class="big" id="bUp">▲ 5 kHz</button>
      <button id="bDx">Torna al DX</button>
    </div>
    <div class="grp" id="spans"><span class="lbl">Larghezza</span>
      <button data-s="1.5">1,5</button><button data-s="3">3</button><button data-s="6">6</button><button data-s="12">12</button><button data-s="30">30</button><button data-s="0">Tutto</button>
    </div>
    <div class="grp" id="bws"><span class="lbl">Filtro RX</span><button data-bw="100">100</button><button data-bw="200">200</button><button data-bw="300">300</button><button data-bw="500">500</button><button data-bw="800">800 Hz</button></div>
    <div class="grp" id="snrs"><span class="lbl">Sensibilità</span><button data-v="4" title="Più nominativi deboli, più errori">Alta</button><button data-v="5">Media</button><button data-v="6" title="Solo segnali puliti">Bassa</button></div>
    <div class="grp" id="wins"><span class="lbl">Scorrimento</span><button data-w="5">5 s</button><button data-w="10">10 s</button><button data-w="20">20 s</button></div>
    <div class="grp" id="chips"><span class="lbl">Ascolti</span></div>
  </div>

  <main class="scope">
    <div class="cell">
      <canvas id="wf" aria-label="Waterfall"></canvas>
      <button id="offTop" class="off top" hidden></button>
      <button id="offBot" class="off bot" hidden></button>
      <div class="menu" id="menu" hidden>
        <button id="mDx">Imposta il DX qui</button>
        <button id="mMark">Segnaposto qui</button>
        <button id="mCenter">Centra la vista qui</button>
      </div>
    </div>
    <div class="cell"><canvas id="tx" aria-label="Testo decodificato"></canvas></div>
  </main>

  <div class="dxline"><span class="who">DX ›</span><span id="dxText"></span></div>

  <div class="set">
    <label for="iDx">DX kHz <input type="number" id="iDx" step="0.01"></label>
    <label for="iUpLo">Zona UP da <input class="short" type="number" id="iUpLo" step="0.5" min="0"></label>
    <label for="iUpHi">a <input class="short" type="number" id="iUpHi" step="0.5" min="0"> kHz</label>
    <label for="iLo" id="loBox">Centro Perseus kHz <input type="number" id="iLo" step="1"></label>
    <label for="selRate" id="rateBox">Campionamento <select id="selRate"><option value="48000">48 kHz</option><option value="96000">96 kHz</option><option value="192000">192 kHz</option></select></label>
    <label for="chkSwap" id="swapBox"><input type="checkbox" id="chkSwap"> Inverti I/Q</label>
    <button id="bGui" hidden>Impostazioni Perseus</button>
    <span id="status"><span class="dot" id="dot"></span>Connessione…</span>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtOff=o=>(o>=0?'+':'−')+Math.abs(o).toFixed(Math.abs(o)<10?2:1);
let CFG=null;

/* ---------------- waterfall ad anello ---------------- */
const RING=3000;                     // 30 s a 100 righe/s
let ring=null,rctx=null,rowImg=null,nrows=0,tNewest=0;
const STOPS=[[0,[6,10,16]],[.15,[11,34,52]],[.38,[20,86,110]],[.62,[63,185,196]],[.85,[168,240,234]],[1,[255,255,255]]];
const LUT=new Uint8ClampedArray(256*3);
for(let v=0;v<256;v++){const x=v/255;for(let i=1;i<STOPS.length;i++){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];if(x<=b){const k=(x-a)/(b-a);for(let j=0;j<3;j++)LUT[v*3+j]=ca[j]+(cb[j]-ca[j])*k;break}}}
function resetRing(){
  ring=document.createElement('canvas');ring.width=RING;ring.height=CFG.nbins;
  rctx=ring.getContext('2d');rctx.fillStyle='#06090d';rctx.fillRect(0,0,RING,CFG.nbins);
  rowImg=rctx.createImageData(1,CFG.nbins);nrows=0;
}
function addRows(t0,n,nb,bytes){
  if(!ring||nb!==CFG.nbins)return;
  const p=rowImg.data;
  for(let r=0;r<n;r++){
    const off=r*nb;
    for(let i=0;i<nb;i++){const v=bytes[off+i],y=nb-1-i,q=y*4;p[q]=LUT[v*3];p[q+1]=LUT[v*3+1];p[q+2]=LUT[v*3+2];p[q+3]=255}
    rctx.putImageData(rowImg,nrows%RING,0);nrows++;
  }
  tNewest=t0+(n-1)*CFG.rowdt;
}

/* ---------------- audio ---------------- */
let ac=null,audioOn=false,nextT=0;
$('#bAudio').onclick=async()=>{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}
  audioOn=!audioOn;
  if(audioOn){await ac.resume();nextT=0}else{await ac.suspend()}
  $('#bAudio').setAttribute('aria-pressed',audioOn);$('#bAudio').textContent=audioOn?'🔊 Audio DX':'🔈 Audio DX';
};
function playAudio(i16){
  if(!audioOn||!ac||!CFG)return;
  const n=i16.length;if(!n)return;
  const buf=ac.createBuffer(1,n,CFG.arate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=i16[i]/32768;
  const now=ac.currentTime;
  if(nextT<now+0.05||nextT>now+0.6)nextT=now+0.15;   // risincronizza
  const s=ac.createBufferSource();s.buffer=buf;s.connect(ac.destination);s.start(nextT);nextT+=n/CFG.arate;
}

/* ---------------- eventi ---------------- */
let WORDS=[],LISTEN=[];
function addEv(m){
  for(const w of m.words)WORDS.push(w);
  for(const l of m.listen)LISTEN.push(l);
  if(WORDS.length>4000)WORDS=WORDS.slice(-3000);
  if(LISTEN.length>300)LISTEN=LISTEN.slice(-200);
  dxDirty=true;chipsDirty=true;
}

/* ---------------- vista (offset in kHz dal centro) ---------------- */
const view={low:-0.6,span:3};let WIN=10;const marks=[];
const half=()=>CFG?CFG.fs/2000:48;
function setLow(v){view.low=clamp(v,-half(),half()-view.span)}
const dxOff=()=>CFG?(CFG.dx-CFG.center)/1000:0;
const toDx=()=>setLow(dxOff()-view.span*0.2);
const centerOn=o=>setLow(o-view.span/2);

/* ---------------- websocket ---------------- */
let ws=null,firstCfg=true;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);ws.binaryType='arraybuffer';
  ws.onopen=()=>{$('#dot').classList.add('on')};
  ws.onclose=()=>{$('#dot').classList.remove('on');setStatus('Connessione persa: riprovo…',true);setTimeout(connect,1500)};
  ws.onmessage=e=>{
    if(typeof e.data==='string'){
      const m=JSON.parse(e.data);
      if(m.type==='cfg'){onCfg(m)}
      else if(m.type==='ev'){addEv(m)}
      else if(m.type==='status'){setStatus(m.text)}
      return;
    }
    const dv=new DataView(e.data),k=dv.getUint8(0);
    if(k===1){const t0=dv.getFloat64(1,true),n=dv.getUint32(9,true),nb=dv.getUint32(13,true);addRows(t0,n,nb,new Uint8Array(e.data,17,n*nb))}
    else if(k===2){playAudio(new Int16Array(e.data.slice(9)))}
  };
}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function setStatus(t,err){const s=$('#status');s.lastChild.nodeValue=' '+t;s.classList.toggle('err',!!err||/errore|non trovo|fallit|non risponde/i.test(t))}
function onCfg(m){
  if(m.status)setStatus(m.status);
  if(!m.ready)return;
  const reset=!CFG||CFG.nbins!==m.nbins||CFG.center!==m.center||CFG.fs!==m.fs;
  const dxMoved=!!CFG&&CFG.dx!==m.dx&&m.dx!==localDx;
  if(m.dx===localDx)localDx=null;
  CFG=m;
  if(reset){resetRing();WORDS=[];LISTEN=[];dxDirty=chipsDirty=true}
  if(firstCfg||reset||dxMoved){firstCfg=false;toDx()}
  if(document.activeElement!==$('#iDx'))$('#iDx').value=(m.dx/1000).toFixed(2);
  if(document.activeElement!==$('#iUpLo'))$('#iUpLo').value=m.up[0];
  if(document.activeElement!==$('#iUpHi'))$('#iUpHi').value=m.up[1];
  if(document.activeElement!==$('#iLo'))$('#iLo').value=(m.center/1000).toFixed(0);
  const live=m.src==='perseus';$('#bGui').hidden=true;$('#iLo').disabled=!live;
  $('#rateBox').hidden=!live;$('#swapBox').hidden=!live;
  if(m.rate_sel&&document.activeElement!==$('#selRate'))$('#selRate').value=String(m.rate_sel);
  $('#chkSwap').checked=!!m.swap;
  $('#tag').textContent=(live?'Perseus dal vivo':'riproduzione registrazione')+` · ${(m.fs/1000).toFixed(1)} kHz`;
  setT($('#sDx'),`${(m.dx/1000).toFixed(2)} kHz`);
  renderBands(m);
}
function renderBands(m){
  const box=$('#bands');box.querySelectorAll('button').forEach(n=>n.remove());
  for(const b of ['160','80','40','30','20','17','15','12','10']){
    const mem=m.bands&&m.bands[b];if(!mem)continue;
    const el=document.createElement('button');el.className='band'+(mem.pred?' pred':'');el.textContent=b;
    el.title=`${b} m · centro ${(mem.centro/1000).toFixed(1)} · DX ${(mem.dx/1000).toFixed(2)} kHz`+(mem.pred?' (predefinita)':'');
    el.setAttribute('aria-pressed',String(m.band===b));
    el.onclick=()=>{send({cmd:'band',band:b});firstCfg=true};
    box.appendChild(el);
  }
}
$('#iDx').onchange=e=>{const v=parseFloat(e.target.value);if(v>0)send({cmd:'dx',hz:v*1000})};
$('#iUpLo').onchange=$('#iUpHi').onchange=()=>send({cmd:'up',lo:parseFloat($('#iUpLo').value)||0,hi:parseFloat($('#iUpHi').value)||10});
$('#iLo').onchange=e=>{const v=parseFloat(e.target.value);if(v>0)send({cmd:'lo',hz:Math.round(v*1000)})};
$('#bGui').onclick=()=>send({cmd:'gui'});
$('#bSave').onclick=()=>send({cmd:'save'});
$('#selRate').onchange=e=>send({cmd:'rate',hz:+e.target.value});
$('#chkSwap').onchange=e=>send({cmd:'swap',on:e.target.checked});

/* ---------------- disegno ---------------- */
const wf=$('#wf'),tx=$('#tx'),wc=wf.getContext('2d'),tc=tx.getContext('2d');
let dpr=1,W=0,H=0,TW=0;const SCALE=64;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const r=wf.getBoundingClientRect(),r2=tx.getBoundingClientRect();
  W=Math.round(r.width*dpr);H=Math.round(r.height*dpr);TW=Math.round(r2.width*dpr);wf.width=W;wf.height=H;tx.width=TW;tx.height=H}
new ResizeObserver(resize).observe($('.scope'));
const yOf=o=>(view.low+view.span-o)*H/view.span;

function drawWF(){
  const c=wc,plotW=W-SCALE*dpr;
  c.fillStyle='#06090d';c.fillRect(0,0,W,H);
  if(!CFG)return;
  const bw=CFG.bw/1000,f0=CFG.f0/1000,nb=CFG.nbins;
  if(ring&&nrows){
    const nWin=Math.round(WIN/CFG.rowdt), n1=nrows, n0=Math.max(n1-nWin,n1-RING,0);
    // righe sorgente: y=0 è il bin più alto (indice nb-1)
    const fTop=f0+(nb-0.5)*bw, fBot=f0-0.5*bw;
    const vHi=Math.min(view.low+view.span,fTop), vLo=Math.max(view.low,fBot);
    if(vHi>vLo){
      const sy=(fTop-vHi)/bw, sh=(vHi-vLo)/bw, dy=yOf(vHi), dh=yOf(vLo)-dy;
      c.imageSmoothingEnabled=true;
      const xOf=n=>plotW-(n1-n)/nWin*plotW;
      let a=n0;
      while(a<n1){
        const col=a%RING, len=Math.min(n1-a,RING-col);
        c.drawImage(ring,col,sy,len,sh,xOf(a),dy,xOf(a+len)-xOf(a),dh);
        a+=len;
      }
    }
  }
  const DX=dxOff(),yd=yOf(DX);
  const fh=Math.max(2*dpr,(CFG.bw_rx||500)/1000*H/view.span);
  c.fillStyle='rgba(88,217,139,.10)';c.fillRect(0,yd-fh/2,plotW,fh);
  c.fillStyle='rgba(88,217,139,.55)';c.fillRect(plotW-6*dpr,yd-fh/2,6*dpr,fh);
  // zona UP
  const u0=yOf(DX+CFG.up[0]),u1=yOf(DX+CFG.up[1]);
  c.fillStyle='rgba(255,176,32,.05)';c.fillRect(plotW-4*dpr,Math.min(u0,u1),4*dpr,Math.abs(u1-u0));
  c.font=`600 ${11*dpr}px Consolas,monospace`;c.textBaseline='bottom';
  const last=LISTEN[LISTEN.length-1];
  for(const e of LISTEN){const age=tNewest-e.t;if(age>180)continue;const y=yOf(e.f/1000);if(y<0||y>H)continue;const nw=e===last;
    c.globalAlpha=nw?1:clamp(.55-age/400,.15,.55);c.strokeStyle='#ffb020';c.lineWidth=(nw?1.6:1)*dpr;c.setLineDash(nw?[]:[4*dpr,4*dpr]);
    c.beginPath();c.moveTo(0,y);c.lineTo(plotW,y);c.stroke();
    if(nw){c.fillStyle='#ffb020';c.fillText(`ascolto ${fmtOff(e.f/1000-DX)} kHz`,8*dpr,y-3*dpr)}}
  c.globalAlpha=1;c.setLineDash([]);
  for(const o of marks){const y=yOf(o);if(y<0||y>H)continue;c.strokeStyle='#e6d3ff';c.lineWidth=1*dpr;c.setLineDash([8*dpr,3*dpr,2*dpr,3*dpr]);c.beginPath();c.moveTo(0,y);c.lineTo(plotW,y);c.stroke();c.setLineDash([]);c.fillStyle='#e6d3ff';c.fillText(`segnaposto ${fmtOff(o-DX)}`,8*dpr,y-3*dpr)}
  c.fillStyle='rgba(108,126,143,.8)';c.font=`400 ${9.5*dpr}px Consolas,monospace`;
  const ts=WIN<=5?1:WIN<=10?2:5;for(let s=0;s<=WIN;s+=ts){const x=plotW-s/WIN*plotW;c.fillRect(x-.5*dpr,H-5*dpr,1*dpr,5*dpr);if(s)c.fillText(`-${s}s`,x+3*dpr,H-2*dpr)}
  // scala
  c.fillStyle='#0b1118';c.fillRect(plotW,0,SCALE*dpr,H);c.fillStyle='#1c2732';c.fillRect(plotW,0,1*dpr,H);
  const sp=view.span,st=sp<=1.5?0.1:sp<=3?0.25:sp<=6?0.5:sp<=12?1:sp<=30?2:sp<=100?10:50;
  const mn=st/(st<0.2?2:st<1?5:st<=2?2:5);c.textBaseline='middle';
  for(let o=Math.ceil(view.low/mn)*mn;o<=view.low+view.span+1e-9;o+=mn){
    const y=yOf(o),maj=Math.abs(o/st-Math.round(o/st))<1e-6;
    c.fillStyle=maj?'#6c7e8f':'#2a3846';c.fillRect(plotW,y,(maj?7:4)*dpr,1*dpr);
    if(maj&&y>9*dpr&&y<H-9*dpr){const f=CFG.center/1000+o;
      c.font=`500 ${11*dpr}px Consolas,monospace`;c.fillStyle='#cfdae4';c.fillText((f%1000).toFixed(st<1?2:1).padStart(st<1?6:5,'0'),plotW+10*dpr,y-6*dpr);
      c.font=`400 ${9.5*dpr}px Consolas,monospace`;c.fillStyle='#6c7e8f';c.fillText(fmtOff(o-DX),plotW+10*dpr,y+6*dpr)}
  }
  if(yd>-10&&yd<H+10){c.fillStyle='#58d98b';c.beginPath();c.moveTo(plotW+1*dpr,yd);c.lineTo(plotW+9*dpr,yd-6*dpr);c.lineTo(plotW+9*dpr,yd+6*dpr);c.closePath();c.fill()}
}

const HOT=/^(5NN|599|TU|5N|ENN|R5NN|5NNTU|TU5NN)$/, CALLRE=/^[A-Z0-9/]*\d[A-Z0-9/]*[A-Z]$/;
function drawTX(){
  const c=tc,lh=16*dpr,padL=18*dpr;c.fillStyle='#0a1016';c.fillRect(0,0,TW,H);if(!CFG)return;
  c.font=`500 ${12.5*dpr}px Consolas,monospace`;c.textBaseline='middle';
  const cw=c.measureText('M').width,maxC=Math.max(6,Math.floor((TW-padL-6*dpr)/cw));
  const t=tNewest,bw=CFG.bw,groups=new Map();
  for(let i=WORDS.length-1;i>=0;i--){const w=WORDS[i];if(t-w.t>40)break;
    const key=w.dx?'dx':Math.round(w.f/(bw*1.5));let g=groups.get(key);if(!g){g={f:w.f,dx:w.dx,ws:[]};groups.set(key,g)}g.ws.unshift(w)}
  const cand=[];
  for(const g of groups.values()){const y=yOf(g.f/1000);if(y<-lh||y>H+lh)continue;const lastT=g.ws[g.ws.length-1].t;
    const hi=g.ws.some(w=>HOT.test(w.w)&&t-w.t<8);cand.push({g,y,lastT,hi,pr:(g.dx?20:0)+(hi?10:0)-(t-lastT)/5})}
  cand.sort((a,b)=>b.pr-a.pr);const placed=[];const free=y=>y>lh/2&&y<H-lh/2&&placed.every(p=>Math.abs(p.ly-y)>=lh);
  for(const it of cand){let ly=null;for(const d of[0,1,-1,2,-2,3,-3]){const yy=it.y+d*lh;if(free(yy)){ly=yy;break}}if(ly==null)continue;it.ly=ly;placed.push(it)}
  for(const it of placed){const{g,y,ly,hi,lastT}=it;c.globalAlpha=t-lastT<8?1:.5;
    if(hi){c.fillStyle='rgba(255,176,32,.13)';c.fillRect(0,ly-lh/2,TW,lh);c.fillStyle='#ffb020';c.fillRect(0,ly-lh/2,3*dpr,lh)}
    c.strokeStyle='#33465a';c.lineWidth=1*dpr;c.beginPath();c.moveTo(0,y);c.lineTo(6*dpr,y);c.lineTo(11*dpr,ly);c.stroke();
    c.fillStyle=g.dx?'#58d98b':hi?'#ffb020':'#3d566c';c.beginPath();c.arc(11*dpr,ly,2.6*dpr,0,7);c.fill();
    let str=g.ws.map(w=>w.w).join(' ');if(str.length>maxC)str=str.slice(-maxC);let x=padL;
    for(const tk of str.split(/(\s+)/)){if(!tk)continue;const w=c.measureText(tk).width;if(/^\s+$/.test(tk)){x+=w;continue}
      if(HOT.test(tk)){c.fillStyle='#ffb020';c.fillRect(x-2*dpr,ly-7.5*dpr,w+4*dpr,15*dpr);c.fillStyle='#1a1205'}
      else if(CALLRE.test(tk))c.fillStyle='#eef4f8';else c.fillStyle='#7d93a6';c.fillText(tk,x,ly+.5*dpr);x+=w}}
  c.globalAlpha=1;
}

const setT=(el,v)=>{if(el.textContent!==v)el.textContent=v};
let dxDirty=true,chipsDirty=true;
function updateUI(){
  if(!CFG)return;const DX=dxOff(),t=tNewest,ctr=CFG.center/1000;
  setT($('#sView'),`${(ctr+view.low).toFixed(1)}–${(ctr+view.low+view.span).toFixed(1)}`);
  const last=LISTEN[LISTEN.length-1];
  setT($('#sLast'),last?`${fmtOff(last.f/1000-DX)} kHz dal DX · ${Math.max(0,Math.round(t-last.t))} s fa`:'—');
  const top=$('#offTop'),bot=$('#offBot');
  if(last&&t-last.t<25){const y=yOf(last.f/1000),l=`ascolto a ${fmtOff(last.f/1000-DX)} kHz`;top.hidden=!(y<0);bot.hidden=!(y>H);setT(top,'▲ '+l);setT(bot,'▼ '+l)}else top.hidden=bot.hidden=true;
  if(chipsDirty){chipsDirty=false;const box=$('#chips');box.querySelectorAll('.chip').forEach(n=>n.remove());
    LISTEN.slice(-6).forEach((e,i,a)=>{const b=document.createElement('button');b.className='chip'+(i<a.length-1?' old':'');b.textContent=fmtOff(e.f/1000-DX);b.onclick=()=>centerOn(e.f/1000);box.appendChild(b)})}
  if(dxDirty){dxDirty=false;const dw=WORDS.filter(w=>w.dx).slice(-40);
    $('#dxText').innerHTML='<span>'+dw.map(w=>{const s=w.w.replace(/[<>&]/g,'');return HOT.test(s)?`<span class="k-hot">${s}</span>`:CALLRE.test(s)?`<span class="k-call">${s}</span>`:s}).join(' ')+'</span>'}
  const full=CFG.fs/1000;
  document.querySelectorAll('#spans button').forEach(b=>b.setAttribute('aria-pressed',String((+b.dataset.s||full)===view.span)));
  document.querySelectorAll('#wins button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.w===WIN)));
  document.querySelectorAll('#bws button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.bw===CFG.bw_rx)));
  document.querySelectorAll('#snrs button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===CFG.snr)));
}

/* ---------------- comandi ---------------- */
$('#bUp').onclick=()=>setLow(view.low+5);$('#bDn').onclick=()=>setLow(view.low-5);$('#bDx').onclick=toDx;
document.querySelectorAll('#spans button').forEach(b=>b.onclick=()=>{if(!CFG)return;const DX=dxOff(),dxIn=DX>view.low&&DX<view.low+view.span,mid=view.low+view.span/2;
  view.span=Math.min(+b.dataset.s||CFG.fs/1000,CFG.fs/1000);if(view.span>=CFG.fs/1000)setLow(-half());else if(dxIn)toDx();else setLow(mid-view.span/2)});
document.querySelectorAll('#wins button').forEach(b=>b.onclick=()=>{WIN=+b.dataset.w});
document.querySelectorAll('#bws button').forEach(b=>b.onclick=()=>send({cmd:'bw',hz:+b.dataset.bw}));
document.querySelectorAll('#snrs button').forEach(b=>b.onclick=()=>send({cmd:'snr',v:+b.dataset.v}));
$('#offTop').onclick=$('#offBot').onclick=()=>{const l=LISTEN[LISTEN.length-1];if(l)centerOn(l.f/1000)};
// Ctrl + rotellina: sposta il DX (50 Hz, con Maiusc 10 Hz); la vista resta ferma
let localDx=null,dxTimer=null;
function nudgeDx(dir,step){
  if(!CFG)return;
  const nd=Math.round((CFG.dx+dir*step)/step)*step;
  CFG.dx=nd;localDx=nd;
  setT($('#sDx'),`${(nd/1000).toFixed(2)} kHz`);
  if(document.activeElement!==$('#iDx'))$('#iDx').value=(nd/1000).toFixed(2);
  clearTimeout(dxTimer);dxTimer=setTimeout(()=>send({cmd:'dx',hz:nd}),120);
}
wf.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey){nudgeDx(e.deltaY<0?1:-1,e.shiftKey?10:50);return}
  setLow(view.low+(e.deltaY<0?1:-1)*view.span/20*(e.shiftKey?.25:1))},{passive:false});
let drag=null,menuAt=null,lpTimer=null;
const offAt=cy=>{const r=wf.getBoundingClientRect();return view.low+view.span-(cy-r.top)/r.height*view.span};
function openMenu(cx,cy){const r=wf.getBoundingClientRect(),m=$('#menu');menuAt=offAt(cy);m.hidden=false;
  m.style.left=Math.min(cx-r.left,r.width-190)+'px';m.style.top=Math.min(cy-r.top,r.height-110)+'px'}
const closeMenu=()=>{$('#menu').hidden=true};
wf.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(e.clientX,e.clientY)});
wf.addEventListener('pointerdown',e=>{closeMenu();if(e.button!==0)return;wf.setPointerCapture(e.pointerId);drag={y:e.clientY,x:e.clientX,low:view.low,moved:false};
  lpTimer=setTimeout(()=>{if(drag&&!drag.moved){openMenu(drag.x,drag.y);drag=null}},600)});
wf.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>5){drag.moved=true;clearTimeout(lpTimer)}if(drag.moved)setLow(drag.low+dy*view.span/(H/dpr))});
wf.addEventListener('pointerup',()=>{clearTimeout(lpTimer);drag=null});
wf.addEventListener('pointercancel',()=>{clearTimeout(lpTimer);drag=null});
$('#mDx').onclick=()=>{if(CFG&&menuAt!=null)send({cmd:'dx',hz:CFG.center+menuAt*1000});closeMenu()};
$('#mMark').onclick=()=>{const i=marks.findIndex(m=>Math.abs(m-menuAt)<view.span/60);if(i>=0)marks.splice(i,1);else marks.push(menuAt);closeMenu()};
$('#mCenter').onclick=()=>{centerOn(menuAt);closeMenu()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const m={PageUp:5,PageDown:-5,ArrowUp:view.span/10,ArrowDown:-view.span/10}[e.key];
  if(m!=null){e.preventDefault();setLow(view.low+m)}else if(e.key==='Home'){e.preventDefault();toDx()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();nudgeDx(e.key==='ArrowRight'?1:-1,e.shiftKey?10:50)}else if(e.key==='Escape')closeMenu()});

function frame(){if(W&&H){drawWF();drawTX()}updateUI();requestAnimationFrame(frame)}
resize();connect();requestAnimationFrame(frame);
})();
</script>
